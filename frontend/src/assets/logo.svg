<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8956C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8B4B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icône lèvres stylisées -->
  <g transform="translate(10, 15)">
    <!-- Lèvre supérieure -->
    <path d="M 25 45 Q 30 25, 45 30 Q 50 20, 55 30 Q 70 25, 75 45"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lèvre inférieure -->
    <path d="M 25 45 Q 50 70, 75 45"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Point brillant -->
    <circle cx="50" cy="35" r="1.5" fill="url(#roseGrad)" opacity="0.8"/>

    <!-- Petite étoile décorative -->
    <path d="M 82 28 L 83.5 32 L 87.5 32 L 84.5 34.5 L 85.5 38.5 L 82 36 L 78.5 38.5 L 79.5 34.5 L 76.5 32 L 80.5 32 Z"
          fill="url(#goldGrad)" opacity="0.6" transform="scale(0.6) translate(60, 10)"/>
  </g>

  <!-- Texte POUT -->
  <text x="105" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" letter-spacing="8" fill="url(#goldGrad)">
    POUT
  </text>

  <!-- Symbole & -->
  <text x="255" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="url(#roseGrad)" opacity="0.7">
    &amp;
  </text>

  <!-- Texte SCENT -->
  <text x="280" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" letter-spacing="8" fill="url(#goldGrad)">
    SCENT
  </text>

  <!-- Ligne décorative sous le texte -->
  <line x1="105" y1="70" x2="395" y2="70" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- Sous-titre -->
  <text x="250" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="6" fill="url(#roseGrad)" text-anchor="middle" opacity="0.7">
    PARFUMS &amp; COSMÉTIQUES
  </text>

  <!-- Petits ornements -->
  <line x1="155" y1="88" x2="185" y2="88" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
  <line x1="315" y1="88" x2="345" y2="88" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
</svg>